<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitkähuilun pituuslaskuri</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef7ee;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
    }
    .result p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Pitkähuilun mitoituslaskuri</h2>
  
  <div class="form-group">
    <label for="note">Valitse pohjasävel:</label>
    <select id="note" onchange="calculateLength()">
      <option value="261.63">C1 (261.63 Hz)</option>
      <option value="277.18">C#1 / Db1 (277.18 Hz)</option>
      <option value="293.66" selected>D1 (293.66 Hz)</option>
      <option value="311.13">D#1 / Eb1 (311.13 Hz)</option>
      <option value="329.63">E1 (329.63 Hz)</option>
      <option value="349.23">F1 (349.23 Hz)</option>
      <option value="369.99">F#1 / Gb1 (369.99 Hz)</option>
      <option value="392.00">G1 (392.00 Hz)</option>
      <option value="415.30">G#1 / Ab1 (415.30 Hz)</option>
      <option value="440.00">A1 (440.00 Hz)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="diameter">Putken sisähalkaisija (mm):</label>
    <input type="number" id="diameter" value="16.2" step="0.1" oninput="calculateLength()">
  </div>

  <div class="form-group">
    <label for="margin">Viritysvara katkaisuun (mm):</label>
    <input type="number" id="margin" value="30" step="1" oninput="calculateLength()">
  </div>

  <div class="result" id="output">
    <!-- Tulokset lasketaan tähän -->
  </div>
</div>

<script>
  function calculateLength() {
    const freq = parseFloat(document.getElementById('note').value);
    const innerDiameterMm = parseFloat(document.getElementById('diameter').value) || 0;
    const marginMm = parseFloat(document.getElementById('margin').value) || 0;
    
    const speedOfSound = 343; // m/s (n. 20°C lämpötilassa)
    
    // Akustinen pituus metreinä
    const acousticLengthM = speedOfSound / (2 * freq);
    
    // Päätekorjaus (end correction) kahdelle avoimelle päälle / labiumille ~ 0.65 * sisähalkaisija
    const endCorrectionM = (0.65 * innerDiameterMm) / 1000;
    
    // Valmis huilun mitta labiumista puimurin päähän + tulpan osuus
    const finalLengthMm = Math.round((acousticLengthM - endCorrectionM) * 1000);
    const initialCutLengthMm = finalLengthMm + marginMm;

    document.getElementById('output').innerHTML = `
      <p><strong>Valmiin huilun pituus:</strong> n. ${finalLengthMm} mm</p>
      <p><strong>Katkaisupituus (sis. viritysvaran):</strong> n. ${initialCutLengthMm} mm</p>
      <p><em>Säädä valmista pituutta tarvittaessa hiomalla tai leikkaamalla testipuhallusten jälkeen.</em></p>
    `;
  }

  // Suoritetaan laskenta sivun latautuessa
  calculateLength();
</script>

</body>
</html>
