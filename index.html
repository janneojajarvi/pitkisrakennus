<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Willow Flute / Koncovka Pipe Length Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .form-group {
      flex: 1;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef7ee;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
    }
    .result p {
      margin: 5px 0;
      font-size: 15px;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Willow Flute Pipe Calculator</h2>
  <p>Calculate the required pipe length based on root key and pipe dimensions.</p>
  
  <div class="form-group">
    <label for="note">Select Root Pitch:</label>
    <select id="note" onchange="calculateLength()">
      <option value="261.63">C3 / C1 (261.63 Hz)</option>
      <option value="277.18">C#3 / Db3 (277.18 Hz)</option>
      <option value="293.66" selected>D3 / D1 (293.66 Hz)</option>
      <option value="311.13">D#3 / Eb3 (311.13 Hz)</option>
      <option value="329.63">E3 / E1 (329.63 Hz)</option>
      <option value="349.23">F3 / F1 (349.23 Hz)</option>
      <option value="369.99">F#3 / Gb3 (369.99 Hz)</option>
      <option value="392.00">G3 / G1 (392.00 Hz)</option>
      <option value="415.30">G#3 / Ab3 (415.30 Hz)</option>
      <option value="440.00">A3 / A1 (440.00 Hz)</option>
    </select>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="outerDiameter">Outer Diameter (mm):</label>
      <input type="number" id="outerDiameter" value="20" step="0.1" oninput="calculateLength()">
    </div>

    <div class="form-group">
      <label for="wallThickness">Wall Thickness (mm):</label>
      <input type="number" id="wallThickness" value="1.5" step="0.1" oninput="calculateLength()">
    </div>
  </div>

  <div class="form-group">
    <label for="margin">Tuning Margin for Initial Cut (mm):</label>
    <input type="number" id="margin" value="30" step="1" oninput="calculateLength()">
  </div>

  <div class="result" id="output">
    <!-- Results generated dynamically -->
  </div>

  <p class="note">
    * Inner diameter is calculated as: Outer Diameter − (2 × Wall Thickness) = <span id="innerDiamText">17.0</span> mm.<br>
    * End correction calculation applies $L_{\text{physical}} = \frac{v}{2f} - 0.65 \times d$.
  </p>
</div>

<script>
  function calculateLength() {
    const freq = parseFloat(document.getElementById('note').value);
    const outerDiameter = parseFloat(document.getElementById('outerDiameter').value) || 0;
    const wallThickness = parseFloat(document.getElementById('wallThickness').value) || 0;
    const marginMm = parseFloat(document.getElementById('margin').value) || 0;
    
    // Calculate inner diameter
    const innerDiameterMm = Math.max(0, outerDiameter - (2 * wallThickness));
    document.getElementById('innerDiamText').innerText = innerDiameterMm.toFixed(1);

    const speedOfSound = 343; // m/s at ~20°C
    
    // Acoustic length in meters (half wavelength for open pipe)
    const acousticLengthM = speedOfSound / (2 * freq);
    
    // End correction for open pipe + labium (~0.65 * inner diameter)
    const endCorrectionM = (0.65 * innerDiameterMm) / 1000;
    
    // Final finished length from labium window to open end
    const finalLengthMm = Math.round((acousticLengthM - endCorrectionM) * 1000);
    const initialCutLengthMm = finalLengthMm + marginMm;

    document.getElementById('output').innerHTML = `
      <p><strong>Finished Flute Length:</strong> approx. <strong>${finalLengthMm} mm</strong></p>
      <p><strong>Initial Cut Length (incl. tuning margin):</strong> approx. <strong>${initialCutLengthMm} mm</strong></p>
      <p style="font-size: 13px; color: #555; margin-top: 8px;">
        <em>Always cut longer first and fine-tune by shortening/sanding the end after testing the pitch.</em>
      </p>
    `;
  }

  // Initial calculation on page load
  calculateLength();
</script>

</body>
</html>
