<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Willow Flute Calculator / Pitkähuilun laskuri</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .form-group {
      flex: 1;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef7ee;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
    }
    .result p {
      margin: 6px 0;
      font-size: 15px;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Willow Flute Calculator / Pitkähuilun laskuri</h2>
  <p>Calculate pipe dimensions for overtone flutes / Laske pitkähuilun mitat.</p>
  
  <div class="form-group">
    <label for="note">Select Pitch / Valitse pohjasävel:</label>
    <select id="note" onchange="calculateLength()">
      <option value="261.63">Low C / Matala C (261.6 Hz)</option>
      <option value="293.66" selected>D (293.7 Hz)</option>
      <option value="329.63">E (329.6 Hz)</option>
      <option value="349.23">F (349.2 Hz)</option>
      <option value="392.00">G (392.0 Hz)</option>
      <option value="440.00">A (440.0 Hz)</option>
      <option value="493.88">B / H (493.9 Hz)</option>
      <option value="523.25">High C / Korkea C (523.3 Hz)</option>
      <option value="587.33">High D / Korkea D (587.3 Hz)</option>
      <option value="659.25">High E / Korkea E (659.3 Hz)</option>
      <option value="698.46">High F / Korkea F (698.5 Hz)</option>
      <option value="783.99">High G / Korkea G (784.0 Hz)</option>
    </select>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="outerDiameter">Outer Diameter / Ulkohalkaisija (mm):</label>
      <input type="number" id="outerDiameter" value="20" step="0.1" oninput="calculateLength()">
    </div>

    <div class="form-group">
      <label for="wallThickness">Wall Thickness / Seinämä (mm):</label>
      <input type="number" id="wallThickness" value="1.9" step="0.1" oninput="calculateLength()">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="fippleLength">Fiopl/Labium Head / Puhalluspää (mm):</label>
      <input type="number" id="fippleLength" value="63" step="1" oninput="calculateLength()">
    </div>

    <div class="form-group">
      <label for="margin">Tuning Margin / Viritysvara (mm):</label>
      <input type="number" id="margin" value="30" step="1" oninput="calculateLength()">
    </div>
  </div>

  <div class="result" id="output">
    </div>

  <p class="note">
    * Inner diameter / Sisähalkaisija: <span id="innerDiamText">16.2</span> mm.<br>
    * Acoustic length formula / Akustinen pituus: $L = \frac{v}{2f} - 0.65 \times d$.
  </p>
</div>

<script>
  function calculateLength() {
    const freq = parseFloat(document.getElementById('note').value);
    const outerDiameter = parseFloat(document.getElementById('outerDiameter').value) || 0;
    const wallThickness = parseFloat(document.getElementById('wallThickness').value) || 0;
    const fippleHeadMm = parseFloat(document.getElementById('fippleLength').value) || 0;
    const marginMm = parseFloat(document.getElementById('margin').value) || 0;
    
    // Inner diameter: 20 - (2 * 1.9) = 16.2 mm
    const innerDiameterMm = Math.max(0, outerDiameter - (2 * wallThickness));
    document.getElementById('innerDiamText').innerText = innerDiameterMm.toFixed(1);

    const speedOfSound = 343; // m/s at ~20°C
    
    // Length from sound hole (labium) to open end (mm)
    const acousticLengthM = speedOfSound / (2 * freq);
    const endCorrectionM = (0.65 * innerDiameterMm) / 1000;
    const windowToEndMm = Math.round((acousticLengthM - endCorrectionM) * 1000);

    // Total finished flute length (fipple head + window to end)
    const totalFinishedLengthMm = windowToEndMm + fippleHeadMm;
    const initialCutLengthMm = totalFinishedLengthMm + marginMm;

    document.getElementById('output').innerHTML = `
      <p><strong>Sound Hole to Open End / Ääniaukosta putken päähän:</strong> approx. <strong>${windowToEndMm} mm</strong></p>
      <p><strong>Total Finished Length / Huilun valmis kokonaispituus:</strong> approx. <strong>${totalFinishedLengthMm} mm</strong></p>
      <p><strong>Initial Cut Length / Katkaisupituus (sis. viritysvaran):</strong> approx. <strong>${initialCutLengthMm} mm</strong></p>
    `;
  }

  calculateLength();
</script>

</body>
</html>
